name: Choose the notification language (English or Hindi) for my organisation
method: PUT
url: ${BASE_URL}/api/v1/org/language
body:
  content: |-
    {
      "language": "en"
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
options:
  substitute_body_variables: false
