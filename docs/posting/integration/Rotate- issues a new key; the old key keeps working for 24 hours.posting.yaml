name: 'Rotate: issues a new key; the old key keeps working for 24 hours'
method: POST
url: ${BASE_URL}/api/v1/bank/api-keys/:id/rotate
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
path_params:
  - name: id
    value: ""
