name: Register an organisation and its first administrator
method: POST
url: ${BASE_URL}/api/v1/onboarding/register
body:
  content: |-
    {
      "orgType": "supplier"
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
options:
  substitute_body_variables: false
