name: Run the funding gates and invite banks (Accepted → OpenForFunding, or NotEligible with reasons)
method: POST
url: ${BASE_URL}/api/v1/invoices/:id/open-funding
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
path_params:
  - name: id
    value: ""
