name: What would paying on this date cost and save?
method: POST
url: ${BASE_URL}/api/v1/invoices/:id/early-payment/quote
body:
  content: |-
    {
      "fundingSource": "cash"
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
path_params:
  - name: id
    value: ""
options:
  substitute_body_variables: false
