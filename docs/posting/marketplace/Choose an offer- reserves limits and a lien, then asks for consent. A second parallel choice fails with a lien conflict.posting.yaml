name: 'Choose an offer: reserves limits and a lien, then asks for consent. A second parallel choice fails with a lien conflict.'
method: POST
url: ${BASE_URL}/api/v1/offers/:id/select
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
path_params:
  - name: id
    value: ""
