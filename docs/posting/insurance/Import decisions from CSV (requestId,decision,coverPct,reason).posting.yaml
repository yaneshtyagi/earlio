name: Import decisions from CSV (requestId,decision,coverPct,reason)
method: POST
url: ${BASE_URL}/api/v1/insurance/decisions/import
body:
  content: '{}'
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
options:
  substitute_body_variables: false
