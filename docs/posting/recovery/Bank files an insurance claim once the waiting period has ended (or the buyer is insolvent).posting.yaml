name: Bank files an insurance claim once the waiting period has ended (or the buyer is insolvent)
method: POST
url: ${BASE_URL}/api/v1/invoices/:id/claims
body:
  content: |-
    {
      "documents": [
        {
          "docType": "invoice"
        }
      ],
      "extra": {}
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
path_params:
  - name: id
    value: ""
options:
  substitute_body_variables: false
