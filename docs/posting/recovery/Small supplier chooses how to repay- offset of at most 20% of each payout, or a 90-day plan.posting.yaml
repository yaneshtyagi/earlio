name: 'Small supplier chooses how to repay: offset of at most 20% of each payout, or a 90-day plan'
method: POST
url: ${BASE_URL}/api/v1/recovery/recourse/:id/mode
body:
  content: |-
    {
      "mode": "offset_20pct"
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
path_params:
  - name: id
    value: ""
options:
  substitute_body_variables: false
