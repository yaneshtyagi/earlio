name: Financing maths (BR-3) for explicit inputs
method: POST
url: ${BASE_URL}/api/v1/pricing/financing
body:
  content: |-
    {
      "platformFeeBps": "0",
      "platformFeePayer": "bank",
      "premiumPayer": "supplier",
      "processingMin": "0",
      "processingPct": "0"
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
options:
  substitute_body_variables: false
