name: 'Platform: decide a dispute; the decision is applied to the invoice and its financing (credit note, recourse, unfreeze)'
method: POST
url: ${BASE_URL}/api/v1/disputes/:id/decision
body:
  content: |-
    {
      "outcome": "buyer"
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
path_params:
  - name: id
    value: ""
options:
  substitute_body_variables: false
