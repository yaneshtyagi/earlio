name: Set a buyer or supplier exposure limit (USD)
method: PUT
url: ${BASE_URL}/api/v1/bank/limits
body:
  content: |-
    {
      "kind": "buyer"
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
options:
  substitute_body_variables: false
