name: Raise a dispute (during the dispute window, or on a funded / overdue invoice); freezes the invoice
method: POST
url: ${BASE_URL}/api/v1/invoices/:id/disputes
body:
  content: '{}'
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
path_params:
  - name: id
    value: ""
options:
  substitute_body_variables: false
