name: Attach an uploaded file as a (new version of a) document
method: POST
url: ${BASE_URL}/api/v1/invoices/:id/documents
body:
  content: |-
    {
      "docType": "commercial_invoice"
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
path_params:
  - name: id
    value: ""
options:
  substitute_body_variables: false
