name: Record a purchase order
method: POST
url: ${BASE_URL}/api/v1/purchase-orders
body:
  content: |-
    {
      "currency": "USD"
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
options:
  substitute_body_variables: false
