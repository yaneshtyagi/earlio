name: Import an exported document as a new draft version (validated like any other draft)
method: POST
url: ${BASE_URL}/api/v1/terms/sets/:id/import
body:
  content: |-
    {
      "body": {}
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
path_params:
  - name: id
    value: ""
options:
  substitute_body_variables: false
