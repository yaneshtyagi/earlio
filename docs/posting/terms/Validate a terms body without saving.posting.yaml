name: Validate a terms body without saving
method: POST
url: ${BASE_URL}/api/v1/terms/validate
body:
  content: |-
    {
      "body": {},
      "ownerType": "platform",
      "scoped": false
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
options:
  substitute_body_variables: false
