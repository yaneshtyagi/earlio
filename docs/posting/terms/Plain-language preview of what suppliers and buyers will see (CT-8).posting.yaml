name: Plain-language preview of what suppliers and buyers will see (CT-8)
method: POST
url: ${BASE_URL}/api/v1/terms/preview
body:
  content: |-
    {
      "body": {},
      "lang": "en",
      "ownerType": "platform"
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
options:
  substitute_body_variables: false
