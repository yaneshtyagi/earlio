name: Simulate a draft bank or insurer terms body against 20 sample invoices (CT-9)
method: POST
url: ${BASE_URL}/api/v1/terms/simulate
body:
  content: |-
    {
      "body": {}
    }
  content_type: application/json
headers:
  - name: Cookie
    value: earlio_sid=${OPENAPI_COOKIEAUTH_0a94b44d_KEY}
  - name: x-csrf-token
    value: ${OPENAPI_CSRF_7ce12ba8_KEY}
options:
  substitute_body_variables: false
