name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm test -w @earlio/web
      - run: npm run build -w @earlio/web
      - name: OpenAPI contract is up to date
        run: |
          npm run openapi
          npm run gen:client
          git diff --exit-code docs/openapi.json apps/web/src/api/schema.d.ts
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci --prefix e2e && npx --prefix e2e playwright install --with-deps chromium
      - name: Start the seeded stack
        run: |
          nohup bash scripts/e2e-stack.sh > /tmp/stack.out 2>&1 &
          timeout 300 bash -c 'until grep -q "stack ready" /tmp/stack.out; do sleep 3; done'
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-report, path: e2e/report }
