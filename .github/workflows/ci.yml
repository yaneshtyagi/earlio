name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm test -w @earlio/web
      - run: npm run build -w @earlio/web
      - name: OpenAPI contract is up to date
        run: |
          npm run openapi
          npm run gen:client
          git diff --exit-code docs/openapi.json apps/web/src/api/schema.d.ts
